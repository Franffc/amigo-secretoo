<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo Secreto de Natal</title>
<style>
:root{--bg:#fff6ec;--card:#ffffff;--ink:#2b1a14;--muted:#7a6a60;--red:#c62828;--green:#1b5e20;--gold:#e8a800;--line:#f0dfcf;--chip:#fdecea}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}
body{display:flex;justify-content:center}#app{width:100%;max-width:430px;padding:0 16px 40px;position:relative;z-index:1}
header{margin:0 -16px 18px;padding:28px 20px 24px;text-align:center;color:#fff;background:linear-gradient(160deg,#b71c1c,#8e1a1a 45%,#1b5e20);border-radius:0 0 28px 28px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
header .tree{font-size:46px}header h1{margin:6px 0 2px;font-family:Georgia,serif;font-size:27px}header p{margin:0;font-size:14px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{margin:0 0 8px;font-size:18px;font-family:Georgia,serif}.muted{color:var(--muted);font-size:14px;line-height:1.45}
button,input,textarea{font:inherit}button{border:0;border-radius:14px;padding:13px 16px;cursor:pointer;font-weight:700;color:#fff;background:var(--red);width:100%;margin-top:10px}button.green{background:var(--green)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}button.small{width:auto;padding:6px 10px;margin:0;font-size:13px}button:disabled{opacity:.5}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:8px;align-items:center}.row>*:first-child{flex:1}.row button{width:auto;margin:0}
.person{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);gap:8px}.person:last-child{border-bottom:0}.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--chip);white-space:nowrap}.tag.ok{background:#e3f4e6;color:#1b5e20}
.pick{display:block;text-align:left;background:var(--chip);color:var(--ink)}.pick.sel{outline:3px solid var(--gold)}.gift{text-align:center;padding:22px 12px}.gift .box{font-size:64px}.gift .name{font-family:Georgia,serif;font-size:32px;color:var(--red);margin:10px 0;word-break:break-word}.hidden-name{letter-spacing:6px;font-size:28px;margin:14px 0;color:var(--gold)}.err{color:var(--red);font-size:14px}.oktxt{color:var(--green);font-size:14px}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden}.snow span{position:absolute;top:-10%;color:#fff;opacity:.8;animation:fall linear infinite}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}@media(prefers-reduced-motion:reduce){.snow{display:none}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div id="app"><header><div class="tree">🎄</div><h1>Amigo Secreto</h1><p>Natal em família e amigos</p></header><div id="view"></div></div>
<script>
(function(){
"use strict";
var STORAGE="amigo-secreto-v3",view=document.getElementById("view"),snow=document.getElementById("snow");
for(var i=0;i<16;i++){var flake=document.createElement("span");flake.textContent="❄";flake.style.left=(i*6.4)+"%";flake.style.fontSize=(10+(i%4)*5)+"px";flake.style.animationDuration=(9+(i%5)*3)+"s";flake.style.animationDelay=(-i*1.3)+"s";snow.appendChild(flake);}
function h(tag,attrs,kids){var e=document.createElement(tag);attrs=attrs||{};for(var k in attrs){if(k=== "class")e.className=attrs[k];else if(k.slice(0,2)==="on")e[k]=attrs[k];else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c=== "string"?document.createTextNode(c):c);});return e;}
function load(){try{var x=JSON.parse(localStorage.getItem(STORAGE));if(x&&Array.isArray(x.people)&&x.assignments&&typeof x.assignments=== "object")return x;}catch(e){}return {people:[],assignments:{},locked:false,currentId:null};}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state));}
function uid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2);}
function randomInt(n){if(window.crypto&&crypto.getRandomValues){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}return Math.floor(Math.random()*n);}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=randomInt(i+1),t=b[i];b[i]=b[j];b[j]=t;}return b;}
var state=load(),newName="",selectedId=state.currentId||null,busy=false,err="",msg="",revealed=false;
function getPerson(id){return state.people.find(function(p){return p.id===id;});}
function started(){return state.locked||Object.keys(state.assignments).length>0;}
function render(){view.textContent="";view.appendChild(adminCard());view.appendChild(participantCard());if(state.people.length)view.appendChild(statusCard());view.appendChild(syncCard());if(err)view.appendChild(h("p",{class:"err"},[err]));if(msg)view.appendChild(h("p",{class:"oktxt"},[msg]));}
function adminCard(){var input=h("input",{type:"text",placeholder:"Nome do participante",maxlength:"40"});input.value=newName;input.oninput=function(){newName=input.value;};var add=h("button",{class:"green",onclick:addPerson},["Adicionar"]);var locked=started();if(locked){input.disabled=true;add.disabled=true;}var list=h("div",{},state.people.map(function(p){var remove=h("button",{class:"ghost small",onclick:function(){removePerson(p);}},["Remover"]);if(locked||p.claimed)remove.disabled=true;return h("div",{class:"person"},[h("span",{},[p.name]),remove]);}));var reset=h("button",{class:"ghost",onclick:resetAll},["Limpar todo o sorteio"]);return h("div",{class:"card"},[h("h2",{},["🎅 Organizador"]),h("p",{class:"muted"},["Cadastre os participantes. Depois, cada pessoa escolhe seu nome e revela o próprio amigo secreto neste aparelho."]),h("div",{class:"row"},[input,add]),locked?h("p",{class:"muted"},["O sorteio começou e a lista está travada."]):null,list,reset]);}
function participantCard(){var person=getPerson(selectedId);if(person){var target=getPerson(state.assignments[person.id]);if(target){var gift=h("div",{class:"gift"},[h("div",{class:"box"},["🎁"]),h("p",{class:"muted"},["Seu amigo secreto é:"]),revealed?h("div",{class:"name"},[target.name]):h("div",{class:"hidden-name"},["• • • • •"]),h("button",{class:revealed?"ghost":"",onclick:function(){revealed=!revealed;render();}},[revealed?"Esconder":"Revelar 🎅"]),h("p",{class:"muted"},["Guarde segredo!"])]);return h("div",{class:"card"},[gift]);}}if(!state.people.length)return h("div",{class:"card"},[h("h2",{},["⏳ Preparação"]),h("p",{class:"muted"},["O organizador ainda não cadastrou os participantes."])]);var available=state.people.filter(function(p){return !p.claimed;});if(!available.length)return h("div",{class:"card"},[h("h2",{},["Tudo certo"]),h("p",{class:"muted"},["Todos já escolheram seu nome."])]);var children=[h("h2",{},["Quem é você? 🎄"]),h("p",{class:"muted"},["Toque no seu nome."])];available.forEach(function(p){children.push(h("button",{class:"pick"+(selectedId===p.id?" sel":""),onclick:function(){selectedId=p.id;revealed=false;render();}},[p.name]));});if(selectedId){var selected=getPerson(selectedId);if(selected&&available.some(function(p){return p.id===selected.id;})){var confirm=h("button",{class:"green",onclick:claimPerson},[busy?"Entrando…":"Confirmar: sou "+selected.name]);if(busy)confirm.disabled=true;children.push(confirm);}}return h("div",{class:"card"},children);}
function statusCard(){var done=state.people.filter(function(p){return !!state.assignments[p.id];}).length;var rows=state.people.map(function(p){var ok=!!state.assignments[p.id];return h("div",{class:"person"},[h("span",{},[p.name]),h("span",{class:"tag"+(ok?" ok":"")},[ok?"🎁 sorteou":"⏳ aguardando"])]);});return h("div",{class:"card"},[h("h2",{},["Progresso ("+done+"/"+state.people.length+")"]),h("div",{},rows)]);}
function syncCard(){var output=h("textarea",{readonly:true,placeholder:"O código exportado aparece aqui"});var exportButton=h("button",{class:"ghost",onclick:function(){exportState(output);}},["Gerar código para copiar"]);var input=h("textarea",{placeholder:"Cole aqui um código exportado"});var importButton=h("button",{class:"green",onclick:function(){importState(input.value);}},["Importar código"]);return h("div",{class:"card"},[h("h2",{},["Compartilhar entre dispositivos"]),h("p",{class:"muted"},["Exporte o sorteio, envie o código e importe em outro aparelho."]),exportButton,output,input,importButton]);}
function addPerson(){var name=(newName||"").trim();err="";msg="";if(!name)return;if(started()){err="A lista está travada depois que o sorteio começa.";render();return;}if(state.people.some(function(p){return p.name.toLocaleLowerCase()===name.toLocaleLowerCase();})) {err="Esse nome já está na lista.";render();return;}state.people.push({id:uid(),name:name,claimed:false});save();newName="";render();}
function removePerson(p){if(started()||p.claimed)return;state.people=state.people.filter(function(x){return x.id!==p.id;});save();render();}
function claimPerson(){if(!selectedId||busy)return;var p=getPerson(selectedId);if(!p||p.claimed){err="Esse nome já foi escolhido.";render();return;}busy=true;err="";msg="";p.claimed=true;state.currentId=p.id;state.locked=true;buildAssignments();save();busy=false;revealed=false;render();}
function buildAssignments(){var participants=shuffle(state.people),count=participants.length;if(count<2){state.assignments={};return;}var receivers,valid=false;for(var attempt=0;attempt<1000&&!valid;attempt++){receivers=shuffle(state.people);valid=true;for(var i=0;i<count;i++){if(participants[i].id===receivers[i].id){valid=false;break;}}}if(!valid){receivers=participants.slice();for(var r=0;r<count;r++){var target=(r+1)%count,t=receivers[target];receivers[target]=receivers[r];receivers[r]=t;}}state.assignments={};for(var j=0;j<count;j++)state.assignments[participants[j].id]=receivers[j].id;}
function resetAll(){if(!confirm("Deseja apagar todos os participantes e resultados?"))return;state={people:[],assignments:{},locked:false,currentId:null};selectedId=null;revealed=false;newName="";err="";msg="";save();render();}
function exportState(output){try{var code=btoa(unescape(encodeURIComponent(JSON.stringify(state))));output.value=code;output.focus();output.select();if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(code);msg="Código gerado e selecionado.";render();}catch(e){err="Não foi possível gerar o código.";render();}}
function importState(code){err="";msg="";try{code=(code||"").trim();if(!code)throw new Error("empty");var data=JSON.parse(decodeURIComponent(escape(atob(code))));if(!data||!Array.isArray(data.people)||!data.assignments||typeof data.assignments!== "object")throw new Error("format");state={people:data.people,assignments:data.assignments,locked:!!data.locked,currentId:data.currentId||null};selectedId=state.currentId||null;save();msg="Sorteio importado com sucesso.";render();}catch(e){err="Código inválido. Gere um novo código no organizador.";render();}}
window.addEventListener("storage",function(e){if(e.key===STORAGE){state=load();selectedId=state.currentId||null;render();}});
render();
})();
</script>
</body>
</html>
